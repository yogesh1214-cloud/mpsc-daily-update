 name: MPSC Daily Update

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update script
        run: echo "Running daily update..."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily updater
        run: python update.py

      - name: Save updated data
        run: |
          git config user.name "mpsc-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily_update.json
          git diff --cached --quiet || git commit -m "Daily MPSC update"
          git push
