 ame: MPSC Daily Update
on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Commit update
        run: |
          git config user.name "mpsc-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily_update.json
          git diff --cached --quiet || git commit -m "Daily MPSC update"
          git push
